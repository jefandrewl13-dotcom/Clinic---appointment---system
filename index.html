
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePoint Clinic - Appointment System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">✚</div>
        <div>
            <h1>CarePoint Clinic</h1>
            <p>Your Health, Our Priority</p>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">

            <div class="page-title">
                <h2>Book an Appointment</h2>
                <p>Fill out the form below to schedule your visit.</p>
            </div>

            <form id="appointmentForm">

                <!-- Patient Information -->
                <section>
                    <h3>Patient Information</h3>

                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Contact Number *</label>
                        <input type="tel" id="phone"
                            placeholder="09XXXXXXXXX"
                            pattern="09[0-9]{9}" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age"
                            min="1" max="120"
                            placeholder="Enter your age" required>
                    </div>

                    <div class="form-group">
                        <label>Gender *</label>
                        <div class="options">
                            <label>
                                <input type="radio" name="gender"
                                    value="Male" required>
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender"
                                    value="Female">
                                Female
                            </label>
                        </div>
                    </div>
                </section>

                <!-- Appointment Details -->
                <section>
                    <h3>Appointment Details</h3>

                    <div class="form-group">
                        <label for="doctor">Select Doctor *</label>
                        <select id="doctor" required>
                            <option value="">Choose a doctor</option>
                            <option value="General Physician">
                                General Physician
                            </option>
                            <option value="Pediatrician">
                                Pediatrician
                            </option>
                            <option value="Dentist">
                                Dentist
                            </option>
                            <option value="Dermatologist">
                                Dermatologist
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Appointment Date *</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Appointment Time *</label>
                        <select id="time" required>
                            <option value="">Select a time</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reason">
                            Reason for Consultation *
                        </label>
                        <textarea id="reason" rows="4"
                            placeholder="Describe your health concern..."
                            required></textarea>
                    </div>
                </section>

                <!-- Confirmation -->
                <section>
                    <div class="confirmation">
                        <label>
                            <input type="checkbox" id="confirm" required>
                            I confirm that the information provided is correct.
                        </label>
                    </div>
                </section>

                <!-- Buttons -->
                <div class="buttons">
                    <button type="submit">
                        Book Appointment
                    </button>

                    <button type="reset" class="reset-btn">
                        Clear Form
                    </button>
                </div>

                <!-- Message -->
                <p id="message" role="status"></p>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CarePoint Clinic. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
                              </html>
